issuer: ${DOMAIN_SCHEME:http}://${DOMAIN_NAME:gateway}:${DOMAIN_PORT:8888}/${KC_HTTP_RELATIVE_PATH:sso}
configserver:
  import: configserver:${CONFIG_SERVER_URL:http://localhost:9296}
spring:
  application:
    name: PRODUCT-SERVICE
  config:
    import: ${configserver.import}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}/realms/tuhin47

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${issuer}/realms/tuhin47
            username-claim: $.preferred_username
            authorities:
              - path: $.realm_access.roles
            aud:
        resourceserver:
          permit-all:
            - /me
            - /v3/api-docs/**
            - /*/v3/api-docs/**
            - /swagger-ui/**
            - /actuator/health/readiness
            - /actuator/health/liveness