version: '3.7'

services:
  axonserver:
    image: axoniq/axonserver:2024.1.4
    hostname: axonserver
    environment:
      - AXONIQ_AXONSERVER_STANDALONE=true
    volumes:
      - axonserver-data:/data
      - axonserver-events:/eventdata
      - axonserver-config:/config:ro
    ports:
      - '8024:8024'
      - '8124:8124'
      - '8224:8224'
    networks:
      - backend

  boilerplate:
    build:
      context: ./angular-boilerplate
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT
        - API_BASE
        - API_CONTEXT
        - OAUTH_REDIRECT_URL
    container_name: boilerplate
    profiles:
      - frontend
      - all
    image: tuhin47/boilerplate:${IMAGE_TAG}
    network_mode: "host"

  database:
    container_name: database
    image: mysql:8.0
    ports:
      - ${MYSQL_PORT}:3306
    restart: always
    environment:
      - MYSQL_USER=extra
      - MYSQL_PORT
      - MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD=$SQL_ROOT_PASSWORD
      - MYSQL_DB=userdb
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "127.0.0.1" ]
      timeout: 20s
      retries: 10

  jaeger-service:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "14250"
    networks:
      - backend

  keycloak:
    hostname: keycloak
    image: keycloak/keycloak:25.0.6
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ${PROJECT_PATH}/keycloak/import/:/opt/keycloak/data/import/
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${KC_HOST}
      #      KC_HOSTNAME_ADMIN: ${KC_HOST}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: true
      KC_HTTP_RELATIVE_PATH: /sso/
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    #      KC_LOG_LEVEL: DEBUG
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;" ]
      interval: 5s
      timeout: 5s
      retries: 20
  proxy:
    container_name: ${DOMAIN_NAME}
    image: nginx:1.27-alpine
    volumes:
      - ${PROJECT_PATH}/keycloak/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - keycloak
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/sso" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  localstack:
    container_name: localstack
    profiles:
      - localstack
    image: localstack/localstack:3.2.0
    environment:
      - DEBUG=1
      - USE_SSL=0
      - AWS_CBOR_DISABLE=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOSTNAME=localstack
      - SERVICES=s3,sns,sqs
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - '4566-4583:4566-4583'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./aws-reactive/script/localstack/s3/init-s3-bucket.sh:/docker-entrypoint-initaws.d/init-s3-bucket.sh
      - ./aws-reactive/script/localstack/snssqs/init-sns-sqs.sh:/docker-entrypoint-initaws.d/init-sns-sqs.sh

  mailcatcher:
    container_name: mailcatcher
    image: schickling/mailcatcher
    ports:
      - '1080:1080'
      - '1025:1025'
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--spider" , "http://mailcatcher:1080" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo:
    image: mongo
    container_name: mongo
    deploy:
      restart_policy:
        max_attempts: 3
        condition: on-failure
    profiles:
      - all
    ports:
      - "27017:27017"
    volumes:
      - mongo-volume:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh 127.0.0.1:27017/admin --quiet
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  testservice:
    container_name: testservice
    profiles:
      - test
    build:
      context: postman_collection
      dockerfile: test.Dockerfile
    image: tuhin47/testservice:${IMAGE_TAG}
    restart: 'no'
    networks:
      - backend

  tracing:
    image: tuhin/opentelemetry-collector:${IMAGE_TAG}
    build:
      context: ./otel
      dockerfile: ./Dockerfile
    ports:
      - "4317:4317"
    networks:
      - backend

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    environment:
      - STORAGE_TYPE=mem
    ports:
      - "9411:9411"
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://zipkin:9411/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

